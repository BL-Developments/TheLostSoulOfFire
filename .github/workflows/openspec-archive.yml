name: OpenSpec archive

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      change:
        description: Name des Changes unter openspec/changes (mehrere durch Leerzeichen getrennt)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openspec-archive
  cancel-in-progress: false

env:
  OPENSPEC: npx --yes @fission-ai/openspec@1.5.0
  OPENSPEC_TELEMETRY: 0

jobs:
  archive:
    name: Archive merged OpenSpec changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.event.pull_request.head.ref, 'chore/archive-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.OPENSPEC_ARCHIVE_TOKEN || github.token }}

      - name: Read OpenSpec changes marked in the pull request description
        id: changes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          INPUT_CHANGE: ${{ inputs.change }}
        run: |
          # Im PR-Text markiert eine Zeile "OpenSpec-Archive: <name> [<name> ...]"
          # die Changes, die nach dem Merge archiviert werden sollen.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            changes="$INPUT_CHANGE"
          else
            changes="$(printf '%s\n' "$PR_BODY" | tr -d '\r' \
              | sed -nE 's/^[[:space:]]*OpenSpec-Archive:[[:space:]]*(.*)$/\1/Ip' \
              | tr -d '`' | tr -s ', \t' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ' || true)"
          fi
          echo "Markierte Changes: ${changes:-keine}"
          {
            echo "changes<<EOF_CHANGES"
            echo "$changes"
            echo "EOF_CHANGES"
          } >> "$GITHUB_OUTPUT"

      - name: Archive changes and open follow-up pull requests
        env:
          GH_TOKEN: ${{ secrets.OPENSPEC_ARCHIVE_TOKEN || github.token }}
          CHANGES: ${{ steps.changes.outputs.changes }}
          BASE_BRANCH: main
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Kopie ausführen, weil das Skript zwischen Branches wechselt.
          cp .github/scripts/archive-openspec-changes.sh "$RUNNER_TEMP/archive.sh"
          bash "$RUNNER_TEMP/archive.sh"
